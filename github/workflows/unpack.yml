name: Unpack uploaded code
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip hidden-kenya.zip into the repository
        if: hashFiles('hidden-kenya.zip') != ''
        run: |
          unzip -o hidden-kenya.zip -d .
          rm hidden-kenya.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Hidden Kenya source"
          git push
